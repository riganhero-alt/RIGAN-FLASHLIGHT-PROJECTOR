name: Build RIGAN Flashlight Projector APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct Android project from uploaded source folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main
          cp "3'AndroidManifest.xml app/src/main/AndroidManifest.xml" app/src/main/AndroidManifest.xml
          cp -R "4.app/src/main/java" app/src/main/
          mkdir -p app/src/main/java/com/rigan/flashlightprojector
          cp "4'Kotlin Source Files app/src/main/java/com/rigan/flashlightprojector/FlashlightController.kt" app/src/main/java/com/rigan/flashlightprojector/FlashlightController.kt
          cp -R "5.XML Layouts app/src/main/res/layout" app/src/main/res/
          cp -R "6.Drawables & Vector Icons app/src/main/res/drawable" app/src/main/res/
          cp -R "7.Values Resources (colors.xml, strings.xml, themes.xml) app/src/main/res/values" app/src/main/res/
          cp "2.App app/build.gradle.kts (Module Level" app/build.gradle.kts
          cp "2.app app/proguard-rules.pro" app/proguard-rules.pro
          cp "2.app build.gradle.kts (Project Level" build.gradle.kts
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RIGAN-Flashlight-Projector"
          include(":app")
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          echo "### Reconstructed Android project" >> "$GITHUB_STEP_SUMMARY"
          find app/src/main -type f | sort >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RIGAN-Flashlight-Projector-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
